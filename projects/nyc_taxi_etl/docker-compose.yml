services:
  dbx:
    image: postgres:17.9-alpine3.22
    environment:
      POSTGRES_DB: taxi_db
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/01_create_tables.sql:/docker-entrypoint-initdb.d/create_tables.sql
      - ./sql/02_create_test_db.sql:/docker-entrypoint-initdb.d/02_create_test_db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d taxi_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  etl:
    # build: .
    image: davidngan/nyc-taxi-etl:v1.3
    env_file:
      - .env
    environment:
      DB_HOST: dbx
      DB_PORT: 5432
    depends_on:
      dbx:
        condition: service_healthy
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs

volumes:
  postgres_data: